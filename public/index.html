<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>WebRTC Call</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/css/uikit.min.css" />
  <link rel="stylesheet" href="index.css">
</head>

<body>
 <!-- Home Section -->
  <div id="home">
    <div>
      <h1>VOIP Chat App</h1>
      <button id="startBtn" class="uk-button uk-button-primary" uk-tooltip="title: Click to start a new call; pos: left">Start</button>
      <button id="joinBtn" class="uk-button uk-button-primary" uk-tooltip="title: Click to join a call; pos: right">Join</button>
    </div>
  </div>

  <!-- Create Section -->
  <div id="create">
    <div class="input-container">
      <p>VOIP Chat</p>
      <input class="uk-input" uk-tooltip="title: Share this code with your friend; pos: right; delay: 100" type="text" id="caller_code" disabled>
      <button id="startCallBtn" class="uk-button uk-button-primary">Start</button>
    </div>
  </div>

  <!-- Join Section -->
  <div id="join">
    <div class="input-container">
      <p>VOIP Chat</p>
      <input class="uk-input" uk-tooltip="title: Enter the code you got from your friend; pos: right; delay: 100" type="text" id="join_code">
      <button id="joinCallBtn" class="uk-button uk-button-primary">Join</button>
    </div>
  </div>

  <!-- Call Section -->
  <div id="call">
    <div class="outer-container">
      <div class="inner-container">
        <div class="video-overlay">
          <video id="localVideo" autoplay></video>
        </div>
        <video id="remoteVideo" autoplay></video>
      </div>
    </div>
    <div>
      <!-- Disconnect Button -->
      <button id="disconnectBtn" class="uk-button uk-button-danger">Disconnect</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/js/uikit.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/js/uikit-icons.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="webrtc.js"></script>
  <script src="index.js"></script>

</body>

</html>
